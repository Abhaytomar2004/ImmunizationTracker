apiVersion: apps/v1
kind: Deployment
metadata:
  name: immunization-tracker
  labels:
    app: immunization-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immunization-tracker
  template:
    metadata:
      labels:
        app: immunization-tracker
    spec:
      containers:
      - name: immunization-tracker
        image: abhaytomar2004/immunizationtracker:latest  
        imagePullPolicy: Always
        ports:
        - containerPort: 8081  
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql-service:3306/lol3" 
        - name: SPRING_DATASOURCE_USERNAME
          value: "root"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "password"
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 20
          periodSeconds: 5